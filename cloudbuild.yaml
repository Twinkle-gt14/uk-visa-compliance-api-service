substitutions:
  _REGION: asia-south1
  _REPO: uk-visa-compliance
  _SERVICE: api-service
  _AR_HOST: ${_REGION}-docker.pkg.dev

steps:
  # Build the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "."

  # Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"]

  # Deploy via `services replace`, NOT `run deploy` - this is a
  # multi-container service (api + pgbouncer sidecar, VPC connector,
  # several secrets). `gcloud run deploy --image=...` only knows how to
  # manage a single-container service and would silently drop the
  # sidecar/VPC/secret config on deploy. We only rewrite the `api`
  # container's image line (pinned to this commit's SHA) and leave the
  # rest of service.yaml - sidecar image, VPC connector, secrets - untouched.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: bash
    args:
      - "-c"
      - |
        sed -i "s|image: ${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:.*|image: ${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}|" service.yaml
        gcloud run services replace service.yaml --region=${_REGION}

images:
  - "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_AR_HOST}/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
