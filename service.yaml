apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-service
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/vpc-access-connector: uk-visa-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/uk-visa-compliance-dev/uk-visa-compliance/api-service:v9
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "6432"
            - name: DB_USER
              value: "app_service"
            - name: DB_NAME
              value: "uk_visa_compliance"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-service-password
                  key: "2"
            - name: AUTH_DB_USER
              value: "auth_service"
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-password
                  key: "1"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-key
                  key: "2"
            - name: NI_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: ni-hmac-key
                  key: "2"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
        - name: pgbouncer
          image: asia-south1-docker.pkg.dev/uk-visa-compliance-dev/uk-visa-compliance/pgbouncer-sidecar:v5